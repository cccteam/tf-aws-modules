name: CI

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened] # these are the defaults - synchronize means 'commits pushed to PR'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-pull-request-title:
    uses: cccteam/github-workflows/.github/workflows/semantic-pull-request-title.yml@c04487636a864da05d2990366d70445d585fdcf4 # v8.3.1
    permissions:
      pull-requests: read