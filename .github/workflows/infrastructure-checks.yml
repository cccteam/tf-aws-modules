name: Infrastructure Checks

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened] # these are the defaults - synchronize means 'commits pushed to PR'

jobs:
  terraform-ci:
    name: Terraform CI
    uses: cccteam/github-workflows/.github/workflows/terraform-ci.yml@c04487636a864da05d2990366d70445d585fdcf4 # v8.3.1
    with:
      terraform_version: '1.14.3'
      upload_sarif: true
    secrets:
      app_client_id: ${{ secrets.TERRAFORM_APP_CLIENT_ID }}
      app_pem: ${{ secrets.TERRAFORM_APP_PEM }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
      security-events: write