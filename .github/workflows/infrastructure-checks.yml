name: Infrastructure Checks

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened] # these are the defaults - synchronize means 'commits pushed to PR'

jobs:
  terraform-ci:
    name: Terraform CI
    uses: cccteam/github-workflows/.github/workflows/terraform-ci.yml@55b489b95381dbec83877cec4f16ae78324a7383 # v9.0.0
    with:
      upload_sarif: true
    secrets:
      app_client_id: ${{ secrets.TERRAFORM_APP_CLIENT_ID }}
      app_pem: ${{ secrets.TERRAFORM_APP_PEM }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
      security-events: write